name: Monitor ISC Jobs - UNAPEC

on:
  schedule:
    # Cron como respaldo cada 30 minutos
    - cron: "*/30 * * * *"
  workflow_dispatch: # Permite correrlo manualmente desde GitHub

permissions:
  contents: write
  actions: write # Necesario para relanzar el workflow

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Ejecutar monitor en loop cada 5 minutos (por 25 minutos)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_UNAPEC }}
        run: |
          for i in 1 2 3 4 5; do
            echo "==============================="
            echo "🔁 Iteración $i de 5 — $(date)"
            echo "==============================="
            
            # Traer el estado más reciente del repo
            git pull --rebase origin main || true

            python monitor.py

            # Guardar estado si hubo cambios
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add isc_state.json
            git diff --staged --quiet || (git commit -m "chore: actualizar estado ISC [skip ci]" && git pull --rebase origin main && git push)

            # Esperar 5 minutos antes de la próxima iteración (excepto en la última)
            if [ $i -lt 5 ]; then
              echo "⏳ Esperando 5 minutos..."
              sleep 300
            fi
          done
