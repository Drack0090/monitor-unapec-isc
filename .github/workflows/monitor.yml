name: Monitor ISC Jobs - UNAPEC

on:
  schedule:
    # Corre cada 5 minutos
    - cron: "*/5 * * * *"
  workflow_dispatch: # Permite correrlo manualmente desde GitHub

permissions:
  contents: write # Necesario para guardar el estado (isc_state.json)

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Restaurar estado guardado
        run: |
          # Si existe el archivo de estado en el repo, usarlo
          if [ -f isc_state.json ]; then
            echo "Estado previo encontrado."
            cat isc_state.json
          else
            echo "Primera ejecución, sin estado previo."
          fi

      - name: Ejecutar monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_UNAPEC }}
        run: python monitor.py

      - name: Guardar estado actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add isc_state.json
          git diff --staged --quiet || git commit -m "chore: actualizar estado ISC [skip ci]"
          git push
